[project]
name = "splitbrain"
version = "0.1.0"
description = "Agents on Switch that resolve contradictions between teams before they reach customers"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "rapidfuzz>=3",
    "python-dotenv>=1",
]

[project.scripts]
splitbrain = "splitbrain.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splitbrain"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the Switch stack (uv run splitbrain up)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
