name: sso
people: {maria: "María Gómez", tomas: "Tomás Rivera", lucia: "Lucía Pérez", pablo: "Pablo Ruiz"}
# The hero scenario. after_s is the pause BEFORE each message, relative to the
# previous one, so the engineering claim lands a few seconds after the sales
# promise and the candidate appears well inside the 20 s budget. Lucía's line is
# deliberately about a topic no other scenario mentions: it must not pair with
# the refund-policy claims when `seed refunds` runs after this one.
messages:
  - {room: sales, as: maria, after_s: 0, text: "Morning! Big one: confirmed with Acme that SSO will be live for them on December 1."}
  - {room: support, as: lucia, after_s: 2, text: "Reminder: the support desk closes at 6 pm this week while half the team is at the offsite."}
  - {room: engineering, as: tomas, after_s: 2, text: "Heads up: we're pulling SSO out of Q4. The auth migration has to land first."}
  - {room: finance, as: pablo, after_s: 2, text: "Q4 budget review moved to Thursday."}
decision:            # used by --auto-decide
  propose: {as: maria, text: "decision: SSO beta for Acme on December 15, GA in Q1. I'll tell Acme today."}
  confirm: {as: tomas, text: "confirm"}
